services:
  - type: web
    name: medpredict-v2
    runtime: python
    buildCommand: pip install -r requirements.txt --prefer-binary
    startCommand: gunicorn "backend.app:create_app()" --bind 0.0.0.0:$PORT --workers 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: medpredict-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: medpredict-db
    plan: free
